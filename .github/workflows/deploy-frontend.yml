name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "deploy/nginx/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        env:
          VITE_API_URL: https://convecsa-preview-backend.atereal.com
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
        working-directory: .

      - name: Sync dist and nginx sites
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        working-directory: .
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "mkdir -p /home/ubuntu/apps/convecsa-erp/frontend/dist /home/ubuntu/apps/convecsa-erp/deploy/nginx"
          rsync -az --delete \
            frontend/dist/ \
            "${VPS_USER}@${VPS_HOST}:/home/ubuntu/apps/convecsa-erp/frontend/dist/"
          rsync -az --delete \
            deploy/nginx/ \
            "${VPS_USER}@${VPS_HOST}:/home/ubuntu/apps/convecsa-erp/deploy/nginx/"
