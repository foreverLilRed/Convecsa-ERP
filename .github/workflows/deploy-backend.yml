name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/erp/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "mkdir -p /home/ubuntu/apps/convecsa-erp/backend/erp /home/ubuntu/apps/convecsa-erp/deploy/nginx"
          rsync -az --delete \
            docker-compose.prod.yml \
            "${VPS_USER}@${VPS_HOST}:/home/ubuntu/apps/convecsa-erp/"
          rsync -az --delete \
            deploy/nginx/ \
            "${VPS_USER}@${VPS_HOST}:/home/ubuntu/apps/convecsa-erp/deploy/nginx/"
          rsync -az --delete \
            --exclude 'target/' \
            --exclude '/erp/' \
            --exclude '.idea/' \
            --exclude '.gradle/' \
            backend/erp/ \
            "${VPS_USER}@${VPS_HOST}:/home/ubuntu/apps/convecsa-erp/backend/erp/"

      - name: Write env and start containers
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          printf '%s\n' \
            "POSTGRES_DB=convecsa" \
            "POSTGRES_USER=convecsa" \
            "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
          | ssh "${VPS_USER}@${VPS_HOST}" "cat > /home/ubuntu/apps/convecsa-erp/.env.prod && chmod 600 /home/ubuntu/apps/convecsa-erp/.env.prod"
          ssh "${VPS_USER}@${VPS_HOST}" "cd /home/ubuntu/apps/convecsa-erp && docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build"
