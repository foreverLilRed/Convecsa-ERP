services:
  backend:
    build:
      context: ./backend/erp
      dockerfile: Dockerfile
    image: convecsa-erp-backend:local
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/convecsa}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-1343}
      APP_NOMINA_MAIL_ENABLED: ${APP_NOMINA_MAIL_ENABLED:-false}
      APP_NOMINA_MAIL_FROM: ${APP_NOMINA_MAIL_FROM:-no-reply@convecsa.pe}
      MAIL_HOST: ${MAIL_HOST:-host.docker.internal}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
