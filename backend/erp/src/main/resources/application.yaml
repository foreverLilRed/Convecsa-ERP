spring:
  application:
    name: erp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/convecsa}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1343}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20
        type:
          # Boot 4 usa Jackson 3; sin esto Hibernate cae en Jackson 2 (vía jjwt) y falla con LocalDate en JSONB.
          json_format_mapper: jackson3
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${APP_JWT_SECRET:convecsa-erp-dev-jwt-secret-key-32bytes-min}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  plantillas:
    pin: ${APP_PLANTILLAS_PIN:6283}
