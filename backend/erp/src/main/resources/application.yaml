spring:
  application:
    name: erp
  datasource:
    url: jdbc:postgresql://localhost:5432/convecsa
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1343}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
