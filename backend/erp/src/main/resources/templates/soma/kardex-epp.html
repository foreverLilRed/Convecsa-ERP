<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Kardex EPP</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; font-size: 11px; color: #1a1a1a; margin: 24px; }
        .membrete { display: table; width: 100%; margin-bottom: 16px; }
        .membrete-logo { display: table-cell; width: 80px; vertical-align: middle; }
        .membrete-datos { display: table-cell; vertical-align: middle; padding-left: 12px; }
        h1 { font-size: 16px; margin: 0 0 4px 0; }
        .muted { color: #555; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #c5c5c5; padding: 6px 8px; text-align: left; }
        th { background: #eef3f8; font-size: 10px; text-transform: uppercase; }
        td.num { text-align: right; }
        .meta { margin-top: 8px; }
        .meta p { margin: 2px 0; }
    </style>
</head>
<body>
    <div class="membrete">
        <div class="membrete-logo">{{logo}}</div>
        <div class="membrete-datos">
            <h1>{{razonSocial}}</h1>
            <p class="muted">RUC {{ruc}}</p>
            <p class="muted">{{domicilio}}</p>
        </div>
    </div>
    <h1>Kardex individual de EPP</h1>
    <div class="meta">
        <p><strong>Obra:</strong> {{obraCodigo}} — {{obraNombre}}</p>
        <p><strong>Trabajador:</strong> {{trabajador}}</p>
        <p><strong>Documento:</strong> {{documento}}</p>
    </div>
    <table>
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Material</th>
                <th>Cantidad</th>
                <th>Talla</th>
                <th>Motivo</th>
                <th>Vencimiento</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            {{filas}}
        </tbody>
    </table>
</body>
</html>
