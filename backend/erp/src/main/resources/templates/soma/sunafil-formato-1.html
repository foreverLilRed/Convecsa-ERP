<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Formato SUNAFIL 1</title>
    <style>
        @page { size: A4 landscape; margin: 12mm; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 9px; color: #1a1a1a; margin: 16px; }
        .membrete { display: table; width: 100%; margin-bottom: 12px; }
        .membrete-logo { display: table-cell; width: 80px; vertical-align: middle; }
        .membrete-datos { display: table-cell; vertical-align: middle; padding-left: 12px; }
        h1 { font-size: 13px; margin: 0 0 4px 0; }
        .muted { color: #555; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #c5c5c5; padding: 4px 5px; text-align: left; }
        th { background: #eef3f8; font-size: 8px; text-transform: uppercase; }
        .meta { margin-top: 6px; }
        .meta p { margin: 2px 0; }
    </style>
</head>
<body>
    <div class="membrete">
        <div class="membrete-logo">{{logo}}</div>
        <div class="membrete-datos">
            <h1>{{razonSocial}}</h1>
            <p class="muted">RUC {{ruc}}</p>
            <p class="muted">{{domicilio}}</p>
        </div>
    </div>
    <h1>{{titulo}}</h1>
    <div class="meta">
        <p><strong>Alcance:</strong> {{alcance}}</p>
        <p><strong>Periodo:</strong> {{periodo}}</p>
    </div>
    <table>
        <thead>
            <tr>{{thead}}</tr>
        </thead>
        <tbody>
            {{filas}}
        </tbody>
    </table>
</body>
</html>
